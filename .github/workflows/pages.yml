name: Publish WorldLeague homepage

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/site/**
      - assets/media/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - name: Package the homepage and its assets
        run: |
          mkdir "$RUNNER_TEMP/site"
          git archive HEAD -- index.html assets/site assets/media | tar -x -C "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy the homepage
        id: deployment
        uses: actions/deploy-pages@v5
